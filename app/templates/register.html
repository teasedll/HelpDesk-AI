{% extends 'auth.html' %}
{% block title %}Регистрация{% endblock %}
{% block auth_form %}
<form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Имя<input name="name" autocomplete="name" maxlength="100" value="{{ request.form.get('name', '') }}" required></label>
    <label>Электронная почта<input type="email" name="email" autocomplete="username" maxlength="255" value="{{ request.form.get('email', '') }}" required></label>
    <label>Пароль<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
    <div class="actions"><button class="button">Зарегистрироваться</button><a href="{{ url_for('login') }}">Войти</a></div>
</form>
{% endblock %}
